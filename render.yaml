# FarmConnect free-tier deployment
# Demo/testing only: free database expires after 30 days, free web services sleep,
# and local uploads are ephemeral. Upgrade storage/database before real production use.

databases:
  - name: farmconnect-db
    plan: free
    region: singapore
    postgresMajorVersion: 16

services:
  - type: web
    name: farmconnect-api
    runtime: node
    plan: free
    region: singapore
    branch: fix/local-updates
    buildCommand: cd backend && npm ci --include=dev && npm run db:generate && npm run build && npm run db:migrate && npm run db:categories
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: farmconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://farmconnect-web.onrender.com
      - key: STORAGE_PROVIDER
        value: local

  - type: web
    name: farmconnect-web
    runtime: node
    plan: free
    region: singapore
    branch: fix/local-updates
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://farmconnect-api-sn98.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://farmconnect-api-sn98.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://farmconnect-web.onrender.com
