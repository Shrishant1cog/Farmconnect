name: FarmConnect Verification v3

on:
  push:
    branches:
      - "fix/verified-build-auth"
  pull_request:

permissions:
  contents: write

jobs:
  normalize-lockfile:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only

      - name: Commit normalized lockfile
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Frontend lockfile already normalized."
            exit 0
          fi
          git config user.name "FarmConnect CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: regenerate frontend npm lockfile [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  verify:
    needs: normalize-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci

      - name: Frontend TypeScript check
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npx tsc --noEmit

      - name: Frontend production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Install backend from lockfile
        working-directory: backend
        run: npm ci

      - name: Backend Prisma generate
        working-directory: backend
        env:
          DATABASE_URL: file:./dev.db
        run: npx prisma generate

      - name: Backend TypeScript build
        working-directory: backend
        run: npm run build

      - name: Backend integration tests
        working-directory: backend
        env:
          DATABASE_URL: file:./dev.db
          JWT_SECRET: farmconnect-verification-secret-key
          NODE_ENV: test
          CLIENT_URL: http://localhost:3000
        run: npm test -- --runInBand

      - name: Validate start.bat
        shell: pwsh
        run: |
          $content = Get-Content -Raw .\start.bat
          if ($content -match 'Preparing Backend Database & Services') {
            throw 'start.bat still contains an unescaped command-separator ampersand.'
          }
          if ($content -notmatch 'Preparing Backend Database \^& Services') {
            throw 'start.bat banner does not escape ampersand.'
          }
          Write-Host 'start.bat static validation passed.'

      - name: Package verified source
        shell: bash
        run: |
          mkdir -p verification-output
          git archive --format=zip --output=verification-output/farmconnect-verified-source.zip "$GITHUB_SHA"
          unzip -t verification-output/farmconnect-verified-source.zip

      - name: Upload verified source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: farmconnect-verified-source
          path: verification-output/farmconnect-verified-source.zip
          if-no-files-found: error
          retention-days: 7
