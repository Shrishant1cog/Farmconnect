name: FarmConnect Verification

on:
  push:
    branches:
      - "fix/verified-build-auth"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Backend Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Backend TypeScript build
        working-directory: backend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand
        continue-on-error: true

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Frontend TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Start backend smoke test
        working-directory: backend
        run: |
          nohup npm run dev > /tmp/farmconnect-backend.log 2>&1 &
          sleep 8
          curl --fail --silent --show-error http://127.0.0.1:5000/api/products -o /tmp/backend-response.txt

      - name: Start frontend smoke test
        working-directory: frontend
        run: |
          nohup npm run start > /tmp/farmconnect-frontend.log 2>&1 &
          sleep 8
          curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/frontend-response.html

      - name: Package verified source
        if: always()
        run: |
          mkdir -p verification-output
          tar --exclude='./.git' --exclude='./backend/node_modules' --exclude='./frontend/node_modules' --exclude='./frontend/.next' --exclude='./backend/dist' -czf verification-output/farmconnect-verified-source.tar.gz .
          cp /tmp/farmconnect-backend.log verification-output/backend.log 2>/dev/null || true
          cp /tmp/farmconnect-frontend.log verification-output/frontend.log 2>/dev/null || true
          cp /tmp/backend-response.txt verification-output/backend-response.txt 2>/dev/null || true
          cp /tmp/frontend-response.html verification-output/frontend-response.html 2>/dev/null || true

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: farmconnect-verification
          path: verification-output/
          retention-days: 7
